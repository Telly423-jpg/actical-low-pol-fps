<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tactical Low-Poly FPS - Arena Edition</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            overflow: hidden;
            background-color: #0b0f19;
            color: #f8fafc;
        }
        #game-canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        /* 顶部现代战术联机面板 */
        #network-ui {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(11, 15, 25, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 10px 22px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            gap: 14px;
            z-index: 100;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #f59e0b;
            box-shadow: 0 0 8px #f59e0b;
            display: inline-block;
        }
        .status-dot.connected { background-color: #10b981; box-shadow: 0 0 10px #10b981; }
        .status-dot.error { background-color: #ef4444; box-shadow: 0 0 10px #ef4444; }
        
        input[type="text"] {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 7px 12px;
            border-radius: 8px;
            outline: none;
            width: 170px;
            font-size: 13px;
            transition: all 0.2s;
        }
        input[type="text"]:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.3);
        }
        input[type="text"]::placeholder { color: #64748b; }
        
        button {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            border: none;
            padding: 7px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }
        button:hover { background: linear-gradient(135deg, #3b82f6, #2563eb); transform: translateY(-1px); }
        button:active { transform: translateY(0); }
        button:disabled { background: #334155; color: #64748b; cursor: not-allowed; box-shadow: none; transform: none; }
        button.secondary { 
            background: linear-gradient(135deg, #059669, #047857); 
            box-shadow: 0 4px 12px rgba(5, 150, 105, 0.3);
        }
        button.secondary:hover { background: linear-gradient(135deg, #10b981, #059669); }

        /* 精致战术准星 */
        #crosshair {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 24px;
            height: 24px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 50;
        }
        #crosshair .line {
            position: absolute;
            background: rgba(56, 189, 248, 0.9);
            box-shadow: 0 0 6px rgba(56, 189, 248, 0.6);
            transition: transform 0.1s, background 0.1s;
        }
        #crosshair .h { top: 11px; left: 2px; width: 8px; height: 2px; }
        #crosshair .h2 { top: 11px; right: 2px; width: 8px; height: 2px; }
        #crosshair .v { top: 2px; left: 11px; width: 2px; height: 8px; }
        #crosshair .v2 { bottom: 2px; left: 11px; width: 2px; height: 8px; }
        #crosshair.hit .line {
            background: #ef4444;
            box-shadow: 0 0 8px #ef4444;
            transform: scale(1.25);
        }

        /* 底部 HUD 战术卡片 */
        #hud-bottom {
            position: fixed;
            bottom: 30px;
            left: 30px;
            right: 30px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            pointer-events: none;
            z-index: 50;
        }
        .tactical-panel {
            background: rgba(11, 15, 25, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 14px 20px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .hp-container { width: 280px; }
        .hp-header {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            color: #94a3b8;
        }
        .hp-bar-bg {
            width: 100%;
            height: 10px;
            background: rgba(51, 65, 85, 0.6);
            border-radius: 5px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
        }
        #hp-bar-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #ef4444, #10b981);
            transition: width 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .stats-box {
            font-size: 15px;
            font-weight: bold;
            letter-spacing: 0.5px;
            display: flex;
            gap: 15px;
        }

        /* 击杀播报动态流 */
        #kill-feed {
            position: fixed;
            top: 90px;
            right: 30px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
            z-index: 60;
            align-items: flex-end;
        }
        .kill-msg {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(6px);
            border-left: 3px solid #38bdf8;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            animation: slideInFadeOut 4s forwards;
        }
        @keyframes slideInFadeOut {
            0% { opacity: 0; transform: translateX(30px); }
            10% { opacity: 1; transform: translateX(0); }
            80% { opacity: 1; transform: translateX(0); }
            100% { opacity: 0; transform: translateX(20px); }
        }

        /* 受击血雾红屏 */
        #damage-overlay {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle, transparent 40%, rgba(225, 29, 72, 0.55) 100%);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.12s ease-out;
            z-index: 40;
        }

        /* 死亡/重生遮罩提示 */
        #respawn-screen {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 90;
            text-align: center;
        }
        #respawn-screen h2 {
            font-size: 38px;
            color: #ef4444;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        #respawn-screen p {
            color: #94a3b8;
            font-size: 16px;
        }

        /* 游戏主引导遮罩 */
        #blocker {
            position: fixed;
            inset: 0;
            background: rgba(7, 10, 18, 0.8);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 80;
            cursor: pointer;
            text-align: center;
        }
        #blocker h1 {
            font-size: 42px;
            font-weight: 800;
            margin-bottom: 12px;
            letter-spacing: 3px;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(56, 189, 248, 0.3);
        }
        #blocker p {
            font-size: 15px;
            color: #94a3b8;
            line-height: 1.8;
        }
        .keycap {
            display: inline-block;
            background: #1e293b;
            border: 1px solid #475569;
            border-bottom-width: 3px;
            padding: 2px 8px;
            border-radius: 4px;
            color: #f1f5f9;
            font-family: monospace;
            font-weight: bold;
            margin: 0 2px;
        }
    </style>

    <!-- 引入 PeerJS (WebRTC 封装库) -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <!-- Import Maps 引入 Three.js 及其扩展 -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <!-- 顶部联机面板 -->
    <div id="network-ui">
        <span class="status-dot" id="status-dot"></span>
        <span id="status-text" style="font-size: 13px; font-weight: 500; color: #e2e8f0;">初始化服务器连接...</span>
        <div style="height: 18px; width: 1px; background: rgba(255,255,255,0.15);"></div>
        <button id="btn-copy-id" class="secondary" disabled>复制房间 ID</button>
        <input type="text" id="input-room-id" placeholder="输入房主 ID 加入...">
        <button id="btn-join" disabled>加入战斗</button>
        <span id="player-count" style="font-size: 12px; color: #64748b; font-weight: 600;">在线: 1</span>
    </div>

    <!-- 受击红屏 -->
    <div id="damage-overlay"></div>

    <!-- 死亡复活专属遮罩 -->
    <div id="respawn-screen">
        <h2>你已被击杀</h2>
        <p>正在重塑战术面部与重生点，2秒后重新部署...</p>
    </div>

    <!-- 战术准星 -->
    <div id="crosshair">
        <div class="line h"></div>
        <div class="line h2"></div>
        <div class="line v"></div>
        <div class="line v2"></div>
    </div>

    <!-- 击杀播报 -->
    <div id="kill-feed"></div>

    <!-- 底部 HUD -->
    <div id="hud-bottom">
        <div class="tactical-panel hp-container">
            <div class="hp-header">
                <span>HEALTH STATUS</span>
                <span id="hp-value" style="color: #10b981;">100</span>
            </div>
            <div class="hp-bar-bg">
                <div id="hp-bar-fill"></div>
            </div>
        </div>
        <div class="tactical-panel stats-box">
            <span>击杀: <span id="kill-count" style="color: #38bdf8;">0</span></span>
        </div>
    </div>

    <!-- 引导进入遮罩 -->
    <div id="blocker">
        <h1>TACTICAL ARENA 3D</h1>
        <p>点击屏幕任意位置锁定鼠标视角并进入战斗</p>
        <p style="font-size: 13px; color: #64748b; margin-top: 12px;">
            <span class="keycap">W</span><span class="keycap">A</span><span class="keycap">S</span><span class="keycap">D</span> 移动 &nbsp;|&nbsp; <span class="keycap">SPACE</span> 跳跃 &nbsp;|&nbsp; <span class="keycap">左键</span> 射击 &nbsp;|&nbsp; <span class="keycap">ESC</span> 释放鼠标
        </p>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        // ==================== 1. 游戏核心配置与状态 ====================
        const PLAYER_HEIGHT = 1.7;
        const PLAYER_RADIUS = 0.45;
        const MOVE_SPEED = 11.0;
        const JUMP_VELOCITY = 8.5;
        const GRAVITY = 22.0;
        const MAX_HP = 100;
        const DAMAGE_PER_HIT = 25;

        const state = {
            hp: MAX_HP,
            kills: 0,
            isDead: false,
            velocity: new THREE.Vector3(),
            canJump: false,
            moveForward: false,
            moveBackward: false,
            moveLeft: false,
            moveRight: false,
            myId: null,
            isHost: true,
            roomHostId: null
        };

        const colliders = [];
        const remotePlayers = {};
        const tracers = [];

        // ==================== 2. Three.js 场景与渲染器初始化 ====================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0c1322);
        scene.fog = new THREE.FogExp2(0x0c1322, 0.015);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, PLAYER_HEIGHT, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.1;
        renderer.domElement.id = 'game-canvas';
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0x1e293b, 1.2);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xfffbeb, 2.0);
        sunLight.position.set(40, 70, 30);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 150;
        const d = 50;
        sunLight.shadow.camera.left = -d;
        sunLight.shadow.camera.right = d;
        sunLight.shadow.camera.top = d;
        sunLight.shadow.camera.bottom = -d;
        sunLight.shadow.bias = -0.0005;
        scene.add(sunLight);

        const fillLight = new THREE.DirectionalLight(0x38bdf8, 0.8);
        fillLight.position.set(-30, 40, -30);
        scene.add(fillLight);

        // ==================== 3. 第一人称武器 ====================
        const gunGroup = new THREE.Group();
        const gunBodyMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.35, metalness: 0.85 });
        const gunBody = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.15, 0.5), gunBodyMat);
        gunBody.position.set(0.25, -0.24, -0.42);

        const topRailMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.5, metalness: 0.9 });
        const topRail = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.04, 0.4), topRailMat);
        topRail.position.set(0.25, -0.16, -0.42);

        const barrelMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.2, metalness: 0.95 });
        const gunBarrel = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.3, 12), barrelMat);
        gunBarrel.rotation.x = Math.PI / 2;
        gunBarrel.position.set(0.25, -0.18, -0.72);

        const sightMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.4, metalness: 0.8 });
        const sightBase = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.06, 0.08), sightMat);
        sightBase.position.set(0.25, -0.12, -0.58);
        
        const reticleMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });
        const reticleDot = new THREE.Mesh(new THREE.SphereGeometry(0.008, 8, 8), reticleMat);
        reticleDot.position.set(0.25, -0.12, -0.58);

        const magMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.6, metalness: 0.5 });
        const mag = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.2, 0.12), magMat);
        mag.position.set(0.25, -0.36, -0.38);
        mag.rotation.x = 0.15;

        gunGroup.add(gunBody, topRail, gunBarrel, sightBase, reticleDot, mag);
        camera.add(gunGroup);
        scene.add(camera);

        // ==================== 4. 竞技场地图构建 ====================
        function buildArena() {
            const floorGeo = new THREE.PlaneGeometry(100, 100, 20, 20);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.8, metalness: 0.1, flatShading: true });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            const gridHelper = new THREE.GridHelper(100, 35, 0x1e293b, 0x1e293b);
            gridHelper.position.y = 0.02;
            scene.add(gridHelper);

            function createBox(x, y, z, w, h, d, color = 0x475569, roughness = 0.6) {
                const geo = new THREE.BoxGeometry(w, h, d);
                const mat = new THREE.MeshStandardMaterial({ color: color, roughness: roughness, metalness: 0.2, flatShading: true });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(x, y, z);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                scene.add(mesh);

                const box3 = new THREE.Box3().setFromObject(mesh);
                colliders.push(box3);
                return mesh;
            }

            const wallH = 6;
            createBox(0, wallH/2, -50, 102, wallH, 2, 0x1e293b, 0.9);
            createBox(0, wallH/2, 50, 102, wallH, 2, 0x1e293b, 0.9);
            createBox(-50, wallH/2, 0, 2, wallH, 102, 0x1e293b, 0.9);
            createBox(50, wallH/2, 0, 2, wallH, 102, 0x1e293b, 0.9);

            createBox(0, 1.5, 0, 7, 3, 7, 0xd97706, 0.4);
            createBox(0, 3.75, 0, 3, 1.5, 3, 0xb45309, 0.4);

            const covers = [
                [-14, 1.25, -14, 4, 2.5, 2.5, 0x0284c7],
                [14, 1.25, 14, 4, 2.5, 2.5, 0x0284c7],
                [-14, 1.25, 14, 2.5, 2.5, 4, 0x0284c7],
                [14, 1.25, -14, 2.5, 2.5, 4, 0x0284c7],
                [-26, 1.5, 0, 3.5, 3, 9, 0x059669],
                [26, 1.5, 0, 3.5, 3, 9, 0x059669],
                [0, 1.5, -26, 9, 3, 3.5, 0x059669],
                [0, 1.5, 26, 9, 3, 3.5, 0x059669],
                [-32, 1, -32, 4.5, 2, 4.5, 0xe11d48],
                [32, 1, 32, 4.5, 2, 4.5, 0xe11d48],
                [-32, 1, 32, 4.5, 2, 4.5, 0x7c3aed],
                [32, 1, -32, 4.5, 2, 4.5, 0x7c3aed]
            ];
            covers.forEach(c => createBox(...c));
        }
        buildArena();

        function getRandomSpawnPoint() {
            const spawns = [
                new THREE.Vector3(-38, PLAYER_HEIGHT, -38),
                new THREE.Vector3(38, PLAYER_HEIGHT, 38),
                new THREE.Vector3(-38, PLAYER_HEIGHT, 38),
                new THREE.Vector3(38, PLAYER_HEIGHT, -38),
                new THREE.Vector3(0, PLAYER_HEIGHT, -38),
                new THREE.Vector3(0, PLAYER_HEIGHT, 38)
            ];
            return spawns[Math.floor(Math.random() * spawns.length)].clone();
        }
        camera.position.copy(getRandomSpawnPoint());

        // ==================== 5. 视角控制与键盘 ====================
        const controls = new PointerLockControls(camera, document.body);
        const blocker = document.getElementById('blocker');

        blocker.addEventListener('click', () => {
            if (!state.isDead) controls.lock();
        });
        controls.addEventListener('lock', () => blocker.style.display = 'none');
        controls.addEventListener('unlock', () => {
            if (!state.isDead) blocker.style.display = 'flex';
        });

        document.addEventListener('keydown', (e) => {
            switch (e.code) {
                case 'KeyW': state.moveForward = true; break;
                case 'KeyS': state.moveBackward = true; break;
                case 'KeyA': state.moveLeft = true; break;
                case 'KeyD': state.moveRight = true; break;
                case 'Space':
                    if (state.canJump) {
                        state.velocity.y = JUMP_VELOCITY;
                        state.canJump = false;
                    }
                    break;
            }
        });

        document.addEventListener('keyup', (e) => {
            switch (e.code) {
                case 'KeyW': state.moveForward = false; break;
                case 'KeyS': state.moveBackward = false; break;
                case 'KeyA': state.moveLeft = false; break;
                case 'KeyD': state.moveRight = false; break;
            }
        });

        document.addEventListener('mousedown', (e) => {
            if (e.button === 0 && controls.isLocked && !state.isDead) {
                shoot();
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ==================== 6. 射击判定与视觉粒子 ====================
        const raycaster = new THREE.Raycaster();
        const crosshairEl = document.getElementById('crosshair');

        function createTracer(startPos, endPos, color = 0xfde047) {
            const points = [startPos, endPos];
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const material = new THREE.LineBasicMaterial({ color: color, transparent: true, opacity: 0.95 });
            const line = new THREE.Line(geometry, material);
            scene.add(line);
            tracers.push({ line, life: 0.12 });
        }

        function shoot() {
            gunGroup.position.z = 0.08;
            gunGroup.rotation.x = 0.08;

            const muzzlePos = new THREE.Vector3();
            gunBarrel.getWorldPosition(muzzlePos);

            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

            // 只收集存活且可见的远端玩家网格进行射线判定
            const remoteMeshes = Object.values(remotePlayers).map(p => p.mesh).filter(m => m.visible);
            const playerIntersects = raycaster.intersectObjects(remoteMeshes, true);

            let wallDist = 120;
            const ray = raycaster.ray;
            for (const box of colliders) {
                const hitPoint = new THREE.Vector3();
                if (ray.intersectBox(box, hitPoint)) {
                    const d = camera.position.distanceTo(hitPoint);
                    if (d < wallDist) wallDist = d;
                }
            }

            let hitPoint = ray.at(wallDist, new THREE.Vector3());
            let hitPeerId = null;

            if (playerIntersects.length > 0) {
                const hit = playerIntersects[0];
                if (hit.distance < wallDist) {
                    hitPoint = hit.point;
                    let obj = hit.object;
                    while (obj && !obj.userData.peerId) {
                        obj = obj.parent;
                    }
                    if (obj && obj.userData.peerId) {
                        hitPeerId = obj.userData.peerId;
                    }
                }
            }

            createTracer(muzzlePos, hitPoint, 0xfde047);

            if (hitPeerId) {
                crosshairEl.classList.add('hit');
                setTimeout(() => crosshairEl.classList.remove('hit'), 150);
            }

            sendNetworkMessage({
                type: 'SHOOT',
                shooterId: state.myId,
                start: muzzlePos.toArray(),
                end: hitPoint.toArray(),
                targetId: hitPeerId
            });
        }

        // ==================== 7. 物理与碰撞 ====================
        function checkCollision(pos) {
            const playerBox = new THREE.Box3(
                new THREE.Vector3(pos.x - PLAYER_RADIUS, pos.y - PLAYER_HEIGHT + 0.15, pos.z - PLAYER_RADIUS),
                new THREE.Vector3(pos.x + PLAYER_RADIUS, pos.y + 0.1, pos.z + PLAYER_RADIUS)
            );
            for (const box of colliders) {
                if (playerBox.intersectsBox(box)) return true;
            }
            return false;
        }

        function updatePhysics(delta) {
            if (state.isDead) return;

            gunGroup.position.z = THREE.MathUtils.lerp(gunGroup.position.z, 0, delta * 15);
            gunGroup.rotation.x = THREE.MathUtils.lerp(gunGroup.rotation.x, 0, delta * 15);

            state.velocity.x -= state.velocity.x * 10.0 * delta;
            state.velocity.z -= state.velocity.z * 10.0 * delta;
            state.velocity.y -= GRAVITY * delta;

            const direction = new THREE.Vector3();
            direction.z = Number(state.moveForward) - Number(state.moveBackward);
            direction.x = Number(state.moveRight) - Number(state.moveLeft);
            direction.normalize();

            if (controls.isLocked) {
                if (state.moveForward || state.moveBackward) state.velocity.z -= direction.z * MOVE_SPEED * 10.0 * delta;
                if (state.moveLeft || state.moveRight) state.velocity.x -= direction.x * MOVE_SPEED * 10.0 * delta;
            }

            const forward = new THREE.Vector3();
            camera.getWorldDirection(forward);
            forward.y = 0;
            forward.normalize();

            const right = new THREE.Vector3();
            right.crossVectors(forward, camera.up).normalize();

            const moveX = (-state.velocity.x * right.x - state.velocity.z * forward.x) * delta;
            const moveZ = (-state.velocity.x * right.z - state.velocity.z * forward.z) * delta;

            const oldPos = camera.position.clone();
            camera.position.x += moveX;
            if (checkCollision(camera.position)) camera.position.x = oldPos.x;

            camera.position.z += moveZ;
            if (checkCollision(camera.position)) camera.position.z = oldPos.z;

            camera.position.y += state.velocity.y * delta;
            if (camera.position.y <= PLAYER_HEIGHT) {
                state.velocity.y = 0;
                camera.position.y = PLAYER_HEIGHT;
                state.canJump = true;
            }
        }

        // ==================== 8. P2P WebRTC 联机系统 (PeerJS) ====================
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');
        const btnCopyId = document.getElementById('btn-copy-id');
        const inputRoomId = document.getElementById('input-room-id');
        const btnJoin = document.getElementById('btn-join');
        const playerCountEl = document.getElementById('player-count');

        const connections = {};

        const peer = new Peer({
            config: {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:global.stun.twilio.com:3478' }
                ]
            }
        });

        peer.on('open', (id) => {
            state.myId = id;
            state.roomHostId = id;
            statusDot.className = 'status-dot connected';
            statusText.textContent = `房间已就绪 (房主模式)`;
            btnCopyId.disabled = false;
            btnJoin.disabled = false;
            updatePlayerCount();
        });

        peer.on('error', (err) => {
            console.error('PeerJS Error:', err);
            statusDot.className = 'status-dot error';
            statusText.textContent = `网络连接异常`;
        });

        peer.on('connection', (conn) => {
            if (!state.isHost) {
                conn.close();
                return;
            }
            setupConnection(conn);
        });

        btnJoin.addEventListener('click', () => {
            const targetId = inputRoomId.value.trim();
            if (!targetId || targetId === state.myId) return;

            Object.values(connections).forEach(c => c.close());
            for (const k in connections) delete connections[k];
            Object.keys(remotePlayers).forEach(removeRemotePlayer);

            state.isHost = false;
            state.roomHostId = targetId;
            statusDot.className = 'status-dot';
            statusText.textContent = '正在呼叫房主...';

            const conn = peer.connect(targetId, { reliable: false });
            setupConnection(conn);
        });

        btnCopyId.addEventListener('click', () => {
            const idToCopy = state.isHost ? state.myId : state.roomHostId;
            navigator.clipboard.writeText(idToCopy).then(() => {
                const orig = btnCopyId.textContent;
                btnCopyId.textContent = '已复制!';
                setTimeout(() => btnCopyId.textContent = orig, 1500);
            });
        });

        function setupConnection(conn) {
            conn.on('open', () => {
                connections[conn.peer] = conn;
                if (!state.isHost) {
                    statusDot.className = 'status-dot connected';
                    statusText.textContent = `已安全接入战场`;
                    btnJoin.disabled = true;
                    inputRoomId.disabled = true;
                }
                addKillFeed(`玩家 [${conn.peer.slice(0, 5)}] 加入了游戏`, '#10b981');
                updatePlayerCount();
            });

            conn.on('data', (data) => handleNetworkData(conn.peer, data));

            conn.on('close', () => {
                delete connections[conn.peer];
                removeRemotePlayer(conn.peer);
                addKillFeed(`玩家 [${conn.peer.slice(0, 5)}] 离开了游戏`, '#64748b');
                updatePlayerCount();

                if (!state.isHost) {
                    statusDot.className = 'status-dot error';
                    statusText.textContent = '与房主断开连接';
                }
            });
        }

        function handleNetworkData(senderPeerId, data) {
            if (state.isHost) {
                Object.values(connections).forEach(conn => {
                    if (conn.peer !== senderPeerId && conn.open) conn.send(data);
                });
            }

            switch (data.type) {
                case 'STATE':
                    updateRemotePlayer(data.id, data.pos, data.rotY, data.hp);
                    break;
                case 'SHOOT':
                    if (data.shooterId !== state.myId) {
                        createTracer(
                            new THREE.Vector3().fromArray(data.start),
                            new THREE.Vector3().fromArray(data.end),
                            0xf87171
                        );
                        if (data.targetId === state.myId && !state.isDead) {
                            takeDamage(DAMAGE_PER_HIT, data.shooterId);
                        }
                    }
                    break;
                case 'KILL':
                    addKillFeed(`[${data.killer.slice(0, 5)}] 击杀了 [${data.victim.slice(0, 5)}]`, '#ef4444');
                    // 如果对方阵亡，立即隐藏该远端玩家模型
                    if (remotePlayers[data.victim]) {
                        remotePlayers[data.victim].mesh.visible = false;
                    }
                    if (data.killer === state.myId) {
                        state.kills++;
                        document.getElementById('kill-count').textContent = state.kills;
                    }
                    break;
            }
        }

        function sendNetworkMessage(payload) {
            Object.values(connections).forEach(conn => {
                if (conn.open) conn.send(payload);
            });
        }

        function updatePlayerCount() {
            const count = Object.keys(connections).length + 1;
            playerCountEl.textContent = `在线: ${count}`;
        }

        // ==================== 9. 精致战术角色模型（摆脱圆蛋感，加入固定重生脸面罩） ====================
        function getColorFromId(id) {
            let hash = 0;
            for (let i = 0; i < id.length; i++) hash = id.charCodeAt(i) + ((hash << 5) - hash);
            const c = (hash & 0x00FFFFFF).toString(16).toUpperCase();
            return '#' + '00000'.substring(0, 6 - c.length) + c;
        }

        function createRemotePlayerMesh(peerId) {
            const group = new THREE.Group();
            group.userData.peerId = peerId;

            const color = getColorFromId(peerId);
            const mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.4, metalness: 0.3, flatShading: true });

            // 方正有力量感的战术躯干（拒绝圆蛋）
            const torsoGeo = new THREE.BoxGeometry(0.6, 0.9, 0.35);
            const torso = new THREE.Mesh(torsoGeo, mat);
            torso.position.y = 0.85;
            torso.castShadow = true;
            group.add(torso);

            // 固定战术重生头盔与高亮面罩脸
            const helmetMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.3, metalness: 0.7 });
            const helmet = new THREE.Mesh(new THREE.BoxGeometry(0.48, 0.4, 0.45), helmetMat);
            helmet.position.set(0, 1.45, 0);
            helmet.castShadow = true;
            group.add(helmet);

            const visorMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8, roughness: 0.1, metalness: 0.9, emissive: 0x0284c7, emissiveIntensity: 0.5 });
            const visor = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.12, 0.08), visorMat);
            visor.position.set(0, 1.45, -0.22);
            group.add(visor);

            scene.add(group);
            return group;
        }

        function updateRemotePlayer(peerId, posArr, rotY, hp) {
            if (!peerId || peerId === state.myId) return;

            if (!remotePlayers[peerId]) {
                remotePlayers[peerId] = {
                    mesh: createRemotePlayerMesh(peerId),
                    targetPos: new THREE.Vector3().fromArray(posArr),
                    targetRotY: rotY,
                    hp: hp
                };
                remotePlayers[peerId].mesh.position.copy(remotePlayers[peerId].targetPos);
                remotePlayers[peerId].mesh.position.y -= PLAYER_HEIGHT;
            } else {
                const p = remotePlayers[peerId];
                p.targetPos.set(posArr[0], posArr[1] - PLAYER_HEIGHT, posArr[2]);
                p.targetRotY = rotY;
                p.hp = hp;
                // 血量为0或小于等于0时自动隐藏消失
                p.mesh.visible = hp > 0;
            }
        }

        function removeRemotePlayer(peerId) {
            if (remotePlayers[peerId]) {
                scene.remove(remotePlayers[peerId].mesh);
                delete remotePlayers[peerId];
            }
        }

        // ==================== 10. 受击反馈、死亡消失与固定重生脸流程 ====================
        const hpValueEl = document.getElementById('hp-value');
        const hpBarFillEl = document.getElementById('hp-bar-fill');
        const damageOverlay = document.getElementById('damage-overlay');
        const respawnScreen = document.getElementById('respawn-screen');
        const killFeedEl = document.getElementById('kill-feed');

        function takeDamage(amount, attackerId) {
            state.hp = Math.max(0, state.hp - amount);
            updateHpUI();

            damageOverlay.style.opacity = '1';
            setTimeout(() => damageOverlay.style.opacity = '0', 180);

            if (state.hp <= 0 && !state.isDead) {
                state.isDead = true;
                
                // 释放鼠标锁定，显示死亡/重生遮罩
                controls.unlock();
                blocker.style.display = 'none';
                respawnScreen.style.display = 'flex';

                addKillFeed(`你被 [${attackerId.slice(0, 5)}] 击杀`, '#ef4444');

                // 通知全服自己阵亡（广播击杀与血量归零）
                sendNetworkMessage({
                    type: 'KILL',
                    killer: attackerId,
                    victim: state.myId
                });

                // 2秒后固定重生：恢复满血、隐藏死亡遮罩、随机传送到安全出生点
                setTimeout(() => {
                    state.hp = MAX_HP;
                    state.isDead = false;
                    state.velocity.set(0, 0, 0);
                    camera.position.copy(getRandomSpawnPoint());
                    updateHpUI();
                    
                    respawnScreen.style.display = 'none';
                    blocker.style.display = 'flex'; // 提示点击重新锁定进入战斗
                }, 2000);
            }
        }

        function updateHpUI() {
            hpValueEl.textContent = state.hp;
            hpBarFillEl.style.width = `${(state.hp / MAX_HP) * 100}%`;
        }

        function addKillFeed(text, borderColor = '#38bdf8') {
            const div = document.createElement('div');
            div.className = 'kill-msg';
            div.style.borderLeftColor = borderColor;
            div.textContent = text;
            killFeedEl.appendChild(div);
            setTimeout(() => div.remove(), 4000);
        }

        // ==================== 11. 主循环渲染 ====================
        const clock = new THREE.Clock();
        let syncTimer = 0;
        const SYNC_INTERVAL = 1 / 20;

        function animate() {
            requestAnimationFrame(animate);

            const delta = Math.min(clock.getDelta(), 0.1);

            updatePhysics(delta);

            Object.values(remotePlayers).forEach(p => {
                if (p.mesh.visible) {
                    p.mesh.position.lerp(p.targetPos, delta * 15);
                    let diff = p.targetRotY - p.mesh.rotation.y;
                    while (diff < -Math.PI) diff += Math.PI * 2;
                    while (diff > Math.PI) diff -= Math.PI * 2;
                    p.mesh.rotation.y += diff * delta * 15;
                }
            });

            for (let i = tracers.length - 1; i >= 0; i--) {
                tracers[i].life -= delta;
                tracers[i].line.material.opacity = Math.max(0, tracers[i].life / 0.12);
                if (tracers[i].life <= 0) {
                    scene.remove(tracers[i].line);
                    tracers[i].line.geometry.dispose();
                    tracers[i].line.material.dispose();
                    tracers[i].line.items = null;
                    tracers.splice(i, 1);
                }
            }

            syncTimer += delta;
            if (syncTimer >= SYNC_INTERVAL && state.myId) {
                syncTimer = 0;
                const euler = new THREE.Euler().setFromQuaternion(camera.quaternion, 'YXZ');
                sendNetworkMessage({
                    type: 'STATE',
                    id: state.myId,
                    pos: [
                        Number(camera.position.x.toFixed(2)),
                        Number(camera.position.y.toFixed(2)),
                        Number(camera.position.z.toFixed(2))
                    ],
                    rotY: Number(euler.y.toFixed(2)),
                    hp: state.hp
                });
            }

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
